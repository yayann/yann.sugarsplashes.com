{{- /* Social share card. PaperMod only emits og:image when a cover exists, so there is no duplicate. */}}
{{- $og := partial "og-image.html" . }}
<meta property="og:image" content="{{ $og }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ .Title }} — yann.sugarsplashes.com">
<meta name="twitter:image:alt" content="{{ .Title }} — yann.sugarsplashes.com">
