<svg viewBox="0 0 1200 555" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46c28e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5a54f"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e8da0"/>
    </marker>
  </defs>

  <!-- load balancer -->
  <rect x="410" y="24" width="380" height="88" rx="10" fill="#151d27" stroke="#26313f" stroke-width="1.5"/>
  <text x="600" y="60" text-anchor="middle" font-size="15" fill="#edf3f9" letter-spacing="1">CLOUDFLARE LOAD BALANCER</text>
  <text x="600" y="86" text-anchor="middle" font-size="12" fill="#7e8da0">health monitor &#183; liveness route &#183; every 1 min</text>

  <!-- lb -> pools -->
  <path d="M 520 112 L 310 184" stroke="#46c28e" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="330" y="140" font-size="12" fill="#46c28e">pool: primary &#183; all traffic</text>
  <path d="M 680 112 L 890 184" stroke="#7e8da0" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow-dim)"/>
  <text x="795" y="140" font-size="12" fill="#7e8da0">pool: standby &#183; failover only</text>

  <!-- primary region panel -->
  <rect x="60" y="190" width="480" height="340" rx="10" fill="#151d27" stroke="#26313f" stroke-width="1.5"/>
  <circle cx="90" cy="222" r="5" fill="#46c28e"/>
  <text x="104" y="227" font-size="13" fill="#edf3f9" letter-spacing="1.5">PRIMARY REGION</text>

  <rect x="90" y="250" width="420" height="50" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="300" y="280" text-anchor="middle" font-size="14" fill="#c7d3df">regional load balancer</text>

  <line x1="190" y1="300" x2="190" y2="320" stroke="#26313f" stroke-width="1.5"/>
  <line x1="410" y1="300" x2="410" y2="320" stroke="#26313f" stroke-width="1.5"/>

  <rect x="90" y="320" width="200" height="50" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="190" y="350" text-anchor="middle" font-size="14" fill="#c7d3df">app vm</text>
  <rect x="310" y="320" width="200" height="50" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="410" y="350" text-anchor="middle" font-size="14" fill="#c7d3df">app vm</text>

  <line x1="190" y1="370" x2="190" y2="440" stroke="#26313f" stroke-width="1.5"/>
  <line x1="410" y1="370" x2="410" y2="440" stroke="#26313f" stroke-width="1.5"/>

  <rect x="90" y="440" width="200" height="60" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="190" y="466" text-anchor="middle" font-size="14" fill="#c7d3df">redis &#183; mongodb</text>
  <text x="190" y="486" text-anchor="middle" font-size="11" fill="#7e8da0">stays home</text>

  <rect x="310" y="440" width="200" height="60" rx="6" fill="#0e141b" stroke="#e5a54f" stroke-width="1.5"/>
  <text x="410" y="466" text-anchor="middle" font-size="14" fill="#edf3f9">mysql primary</text>
  <text x="410" y="486" text-anchor="middle" font-size="11" fill="#7e8da0">all writes land here</text>

  <!-- standby panel -->
  <rect x="660" y="190" width="480" height="340" rx="10" fill="#151d27" stroke="#26313f" stroke-width="1.5"/>
  <circle cx="690" cy="222" r="5" fill="#7e8da0"/>
  <text x="704" y="227" font-size="13" fill="#edf3f9" letter-spacing="1.5">STANDBY REGION &#183; A CONTINENT AWAY</text>

  <rect x="690" y="250" width="420" height="50" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="900" y="280" text-anchor="middle" font-size="14" fill="#c7d3df">app vm &#183; octane / frankenphp</text>

  <path d="M 790 300 L 790 334" stroke="#46c28e" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="804" y="322" font-size="12" fill="#46c28e">reads &#183; local</text>
  <line x1="1010" y1="300" x2="1010" y2="340" stroke="#26313f" stroke-width="1.5"/>

  <rect x="690" y="340" width="200" height="60" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="790" y="366" text-anchor="middle" font-size="14" fill="#c7d3df">mysql read replica</text>
  <text x="790" y="386" text-anchor="middle" font-size="11" fill="#7e8da0">async from primary</text>

  <rect x="910" y="340" width="200" height="60" rx="6" fill="#0e141b" stroke="#26313f" stroke-width="1.5"/>
  <text x="1010" y="366" text-anchor="middle" font-size="14" fill="#c7d3df">local redis</text>
  <text x="1010" y="386" text-anchor="middle" font-size="11" fill="#7e8da0">own cache, on purpose</text>

  <text x="900" y="470" text-anchor="middle" font-size="12" fill="#7e8da0">no queue workers &#183; no scheduler</text>
  <text x="900" y="490" text-anchor="middle" font-size="12" fill="#7e8da0">web traffic only</text>

  <!-- writes crossing the gap -->
  <path d="M 690 275 L 600 275 L 600 470 L 518 470" stroke="#e5a54f" stroke-width="2.5" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="612" y="380" font-size="12" fill="#e5a54f">writes</text>
  <text x="612" y="398" font-size="11" fill="#7e8da0">~140ms rtt</text>
</svg>
